name: Check image service and release candidate
description: Verify renderers, public artifacts, HTTP and receiver compatibility.
runs:
  using: composite
  steps:
    - name: Materialize locked vendor assets offline
      shell: bash
      run: python3 -B -m tools.assets.prepare_vendor_assets
    - name: Build and validate the published renderer package
      shell: bash
      run: |
        python3 -B -m tools.release.prepare_image_service dist/image-service
        docker build --pull -f image_service/Dockerfile -t shirasu-images:test dist/image-service
        docker run --rm --network none shirasu-images:test python -m pip check
        docker run --rm --network none --volume "$PWD:/checks:ro" \
          shirasu-images:test python -B /checks/tools/release/check_licenses.py \
          --requirements /app/requirements.txt
        docker run --rm --network none shirasu-images:test python -B -c \
          'from image_service.render_v4 import verify_assets; verify_assets()'
    - name: Build the development renderer package
      shell: bash
      run: |
        python3 -B -m tools.assets.prepare_vendor_assets --check
        python3 -B -m tools.release.prepare_image_service --include-preview dist/image-preview
        docker build -f image_service/Dockerfile -t shirasu-images:preview dist/image-preview
        docker run --rm --network none shirasu-images:preview python -B -c \
          'from image_service.render_preview import verify_assets; verify_assets()'
    - name: Check renderer, assets and release tooling
      shell: bash
      run: |
        for group in images assets release; do
          docker run --rm --network none --volume "$PWD:/source:ro" --workdir /source \
            shirasu-images:preview python -B -m unittest discover -s "tests/$group" -v
        done
        docker run --rm --network none --volume "$PWD:/source:ro" --workdir /source \
          shirasu-images:preview python -B -m unittest -v \
          tests.receiver.test_image_protocol tests.receiver.test_image_versions \
          tests.receiver.test_webp_protocol tests.receiver.test_image_alt tests.receiver.test_nankai_image
    - name: Prepare immutable release rehearsal packages
      shell: bash
      run: |
        python3 -B -m tools.release.prepare_release_candidate dist/release-check/candidate
        python3 -B -m tools.release.prepare_release_baseline dist/release-check/legacy --ref 43e0fa4
        python3 -B -m tools.release.prepare_release_baseline dist/release-check/legacy \
          --candidate-images dist/release-check/candidate/images --allow-routing-changes > dist/release-check/source-comparison.json
        mkdir dist/release-check/results
        docker build --pull=false -t shirasu-images:rehearsal dist/release-check/candidate/images
        docker build --pull=false -t shirasu:rehearsal dist/release-check/candidate/receiver
        docker run --rm --network none --volume "$PWD:/checks:ro" \
          shirasu:rehearsal python -B /checks/tools/release/check_licenses.py \
          --requirements /app/requirements/receiver.txt
        docker run --rm --network none --volume "$PWD:/checks:ro" \
          shirasu-images:rehearsal python -B /checks/tools/release/check_licenses.py \
          --requirements /app/requirements.txt
    - name: Verify release Compose merge, startup and PNG cutback
      shell: bash
      run: |
        python3 -B -m unittest discover -s tests/release -p 'test_release_compose*.py' -v
        python3 -B -m tools.release.check_release_compose \
          --bundle dist/release-check/candidate --image shirasu:rehearsal \
          --output dist/release-check/results/compose.json
    - name: Verify signed posts, old URLs, candidate PNGs and rollback
      shell: bash
      run: |
        docker run --rm --network none \
          --volume "$PWD/dist/release-check/candidate:/candidate:ro" \
          --volume "$PWD:/checks:ro" --volume "$PWD/dist/release-check/results:/output" \
          --workdir /candidate/receiver --env PYTHONPATH=/candidate/receiver:/checks \
          shirasu:rehearsal python -B -m tools.release.check_release_receiver \
          --bundle /candidate --output /output/posts.json
        docker run --rm --network none \
          --volume "$PWD/dist/release-check/legacy:/legacy:ro" \
          --volume "$PWD:/checks:ro" --volume "$PWD/dist/release-check/results:/output" \
          --workdir /legacy --env PYTHONPATH=/legacy:/checks \
          shirasu-images:rehearsal python -B -m tools.release.check_release_images \
          --legacy-package /legacy --events /output/posts.json --output /output/legacy.json
        docker run --rm --network none \
          --volume "$PWD/dist/release-check/candidate:/candidate:ro" \
          --volume "$PWD:/checks:ro" --volume "$PWD/dist/release-check/results:/output" \
          --workdir /candidate/images --env PYTHONPATH=/candidate/images:/checks \
          shirasu-images:rehearsal python -B -m tools.release.check_release_images \
          --bundle /candidate --events /output/posts.json --legacy-result /output/legacy.json \
          --output /output/images.json
        python3 -B -m tools.release.prepare_release_candidate --verify dist/release-check/candidate
    - name: Verify fixed WebP profile from signed posts to HTTP
      shell: bash
      run: |
        docker run --rm --network none \
          --volume "$PWD/dist/release-check/candidate:/candidate:ro" \
          --volume "$PWD:/checks:ro" --volume "$PWD/dist/release-check/results:/output" \
          --workdir /candidate/receiver --env PYTHONPATH=/candidate/receiver:/checks \
          shirasu:rehearsal python -B -m tools.release.check_webp_release receiver \
          --bundle /candidate --output /output/webp-posts.json
        docker run --rm --network none \
          --volume "$PWD:/checks:ro" --volume "$PWD/dist/release-check/results:/output" \
          --workdir /checks --env PYTHONPATH=/checks \
          shirasu-images:rehearsal python -B -m tools.preview.render_gallery \
          --preview-only --output /output/png-gallery
        docker run --rm --network none \
          --volume "$PWD/dist/release-check/candidate:/candidate:ro" \
          --volume "$PWD:/checks:ro" --volume "$PWD/dist/release-check/results:/output" \
          --workdir /candidate/images --env PYTHONPATH=/candidate/images:/checks \
          shirasu-images:rehearsal python -B -m tools.release.check_webp_release images \
          --bundle /candidate --events /output/webp-posts.json --gallery /output/png-gallery \
          --output /output/webp-http.json
        python3 -B -m tools.release.prepare_release_candidate --verify dist/release-check/candidate
    - name: Prepare public verification artifact
      shell: bash
      run: >-
        python3 -B -m tools.release.prepare_ci_artifact
        --check-root dist/release-check --output dist/release-check/public
    - name: Upload public verification artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: image-checks-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist/release-check/public/
        retention-days: 14
        if-no-files-found: error
        include-hidden-files: false

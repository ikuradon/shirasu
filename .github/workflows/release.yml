name: Publish verified image release

# Distribution revisions (images-v5-r1) keep the renderer URL version unchanged.
# Only an explicit release tag or a manual main run may publish.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: New distribution tag (for example images-v5-r2)
        required: true
        type: string
  push:
    tags: ['images-v*']

permissions:
  contents: read

concurrency:
  group: publish-image-release
  cancel-in-progress: false

jobs:
  verify-receiver:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/images-v') && !github.event.deleted)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check receiver
        uses: ./.github/actions/check-receiver
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/images-v') && !github.event.deleted)
    needs: verify-receiver
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      release_tag: ${{ steps.publish.outputs.release_tag }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the same commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Build and check images on the publication runner
        uses: ./.github/actions/check-images
      - name: Authenticate to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      - name: Publish the checked images and release metadata
        id: publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 -B -m tools.release.publish_ci_release \
            --check-root dist/release-check \
            --receiver-image shirasu:rehearsal \
            --renderer-image shirasu-images:rehearsal \
            --release-tag "$RELEASE_TAG"
      - name: Log out of GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io
  vercel:
    needs: [release, restore]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/vercel-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  restore:
    needs: release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    # The runner starts without the publishing job's images or workspace.
    # Writes are needed only for latest aliases and the public restore report.
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the same commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the stored release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          mkdir -p dist/registry-restore/metadata
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern release.json --pattern candidate-manifest.json \
            --dir dist/registry-restore/metadata
      - name: Authenticate to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      - name: Restore fixed digests and promote latest after verification
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 -B -m tools.release.verify_ci_restore
          --release dist/registry-restore/metadata/release.json
          --manifest dist/registry-restore/metadata/candidate-manifest.json
          --output dist/registry-restore/verified
      - name: Retain the restore result in the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            dist/registry-restore/verified/restore-result.json
      - name: Log out of GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io

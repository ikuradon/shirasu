name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare isolated source and build renderer
        run: |
          python3 scripts/prepare_image_service.py dist/image-service
          docker build --pull -f image_service/Dockerfile -t shirasu-images:test dist/image-service
      - name: Check image dependencies
        run: docker run --rm --network none shirasu-images:test python -m pip check
      - name: Check bundled renderers and map assets
        run: >-
          docker run --rm --network none shirasu-images:test python -B -c
          'from image_service.render_v4 import verify_assets; verify_assets()'
      - name: Check PNGs, signed HTTP responses, and source isolation
        run: >-
          docker run --rm --network none --volume "$PWD:/source:ro" --workdir /source
          shirasu-images:test sh -c 'for suite in image_protocol image_renderer image_renderer_v2
          image_renderer_v3 image_renderer_v4 image_package image_versions regional_reports marine_regions region_map
          weather_map weather_map_v4 eew_map volcano_map map_v3; do
          python -B -m unittest discover -s tests -p "test_${suite}.py" -v || exit 1; done'
      - name: Build unpublished offline preview
        run: |
          python3 scripts/prepare_image_service.py --include-preview dist/image-preview
          docker build -f image_service/Dockerfile -t shirasu-images:preview dist/image-preview
          docker run --rm --network none shirasu-images:preview python -B -c \
            'from image_service.render_preview import verify_assets; verify_assets()'
      - name: Check forecast points and offline preview isolation
        run: >-
          docker run --rm --network none --volume "$PWD:/source:ro" --workdir /source
          shirasu-images:preview sh -c 'for suite in nwp_assets nwp_reports nwp_renderer image_preview_cli; do
          python -B -m unittest discover -s tests -p "test_${suite}.py" -v || exit 1; done'
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: |
          cp config.py.sample config.py
          docker compose config --quiet
          docker compose -f compose.yaml -f monitoring/compose.observer.yaml config --quiet

      - name: Build application image
        run: docker build --pull --tag shirasu:test .

      - name: Check installed dependencies
        run: docker run --rm --network none shirasu:test python -m pip check

      - name: Run regression tests
        run: docker run --rm --network none shirasu:test python -B -m unittest discover -s tests -v

      - name: Build integration test image
        run: docker build --target test --tag shirasu:integration .

      - name: Run connection and crash recovery tests
        run: docker run --rm --network none shirasu:integration python -B -m unittest discover -s tests/integration -v

      - name: Check alert firing and recovery
        run: >-
          docker run --rm --network none --entrypoint promtool
          --volume "$PWD/monitoring:/rules:ro"
          prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
          test rules /rules/alerts.test.yml

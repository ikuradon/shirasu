x-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  shirasu:
    build:
      context: .
    restart: always
    logging: *bounded-logging
    # gpsd listens on the Linux host's loopback interface.
    network_mode: host
    environment:
      PYTHONUNBUFFERED: "1"
      SHIRASU_STATE_PATH: /data/shirasu.sqlite3
      SHIRASU_IMAGE_BASE_URL: "${SHIRASU_IMAGE_BASE_URL:-}"
      SHIRASU_IMAGE_KEY_ID: "${SHIRASU_IMAGE_KEY_ID:-}"
      SHIRASU_IMAGE_VERSION: "${SHIRASU_IMAGE_VERSION:-v1}"
      SHIRASU_IMAGE_SIGNING_KEY: "${SHIRASU_IMAGE_SIGNING_KEY:-}"
      SHIRASU_TYPHOON_WAIT_SECONDS: "${SHIRASU_TYPHOON_WAIT_SECONDS:-180}"
      SHIRASU_NANKAI_WAIT_SECONDS: "${SHIRASU_NANKAI_WAIT_SECONDS:-180}"
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "main.py", "--health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - type: bind
        source: ./config.py
        target: /app/config.py
        read_only: true
      - shirasu-state:/data
    extra_hosts:
        - "host.docker.internal:127.0.0.1"

  metrics:
    build:
      context: .
    command: ["python", "metrics.py"]
    restart: always
    logging: *bounded-logging
    environment:
      PYTHONUNBUFFERED: "1"
      SHIRASU_STATE_PATH: /data/shirasu.sqlite3
      SHIRASU_BACKUP_DIR: /backups
    ports:
      - "127.0.0.1:9016:9016"
    volumes:
      # SQL uses mode=ro + query_only. SQLite still needs to create WAL/SHM
      # helpers when reading a database whose writer has stopped cleanly.
      - shirasu-state:/data
      - type: bind
        source: ./backups/auto
        target: /backups
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9016/healthz', timeout=2).close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  backup:
    build:
      context: .
    command: ["python", "backup_worker.py"]
    restart: always
    network_mode: none
    logging: *bounded-logging
    environment:
      PYTHONUNBUFFERED: "1"
      SHIRASU_STATE_PATH: /data/shirasu.sqlite3
      SHIRASU_BACKUP_DIR: /backups
      SHIRASU_BACKUP_INTERVAL_SECONDS: "${SHIRASU_BACKUP_INTERVAL_SECONDS:-3600}"
      SHIRASU_BACKUP_KEEP_COUNT: "${SHIRASU_BACKUP_KEEP_COUNT:-168}"
    stop_grace_period: 90s
    volumes:
      # SQL remains read-only; SQLite may create WAL/SHM helpers after shutdown.
      - shirasu-state:/data
      - type: bind
        source: ./backups/auto
        target: /backups
    healthcheck:
      test: ["CMD", "python", "backup_worker.py", "--health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  shirasu-state:
